stages:
  prod:
    cognition:
      openai:
        base_url: https://api.openai.com/v1
        api_key: ${OPENAI_API_KEY}
        default_model: gpt-5.4-mini
        temperature: 0
        timeout_seconds: 600
    search:
      backend: tavily
      tavily:
        api_key: ${TAVILY_API_KEY}
        base_url: https://api.tavily.com
        max_results: 3
        topic: general
        include_raw_content: true
        timeout_seconds: 300
    roles:
      supervisor: {backend: openai, handle: gpt-5.5, max_tokens: 128000, timeout_seconds: 600}
      red_team: {backend: openai, handle: gpt-5.5, max_tokens: 128000, timeout_seconds: 600}
      context_pruner: {backend: openai, handle: gpt-5.4-nano, max_tokens: 128000, timeout_seconds: 600}
      researcher_main: {backend: openai, handle: gpt-5.4-nano, max_tokens: 128000, timeout_seconds: 600}
      researcher_summarizer: {backend: openai, handle: gpt-5.4-nano, max_tokens: 128000, timeout_seconds: 600}
      researcher_compressor: {backend: openai, handle: gpt-5.4-nano, max_tokens: 128000, timeout_seconds: 600}
      writer: {backend: openai, handle: gpt-5.5, max_tokens: 128000, timeout_seconds: 600}
      draft: {backend: openai, handle: gpt-5.4-nano, max_tokens: 128000, timeout_seconds: 600}
      evaluator: {backend: openai, handle: gpt-5.4-nano, max_tokens: 128000, timeout_seconds: 600}
